[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Scheduled function: process email queue every 15 minutes
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cron: send queued emails every 15 minutes
[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "send-emails"
  path = "/api/cron/send-emails"

# Redirects
[[redirects]]
  from = "/"
  to = "/dashboard"
  status = 302

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
